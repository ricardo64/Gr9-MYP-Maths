<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grade 9 MYP Mathematics — Interactive Lessons</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body {
      font-family: 'DM Sans', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .font-math {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-5 py-5 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3.5">
        <div class="w-11 h-11 rounded-2xl bg-sky-500/20 border border-sky-400/40 text-sky-400 flex items-center justify-center font-math font-bold text-lg">
          G9
        </div>
        <div>
          <p class="text-xs font-bold uppercase tracking-widest text-sky-400">MYP Mathematics</p>
          <h1 class="text-xl sm:text-2xl font-extrabold text-white">Grade 9 Interactive Lesson Hub</h1>
        </div>
      </div>
      <span class="text-xs font-semibold text-slate-400 bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-full">
        Algebra &amp; Equations Unit
      </span>
    </div>
  </header>

  <!-- Main Lesson Grid -->
  <main class="max-w-5xl w-full mx-auto px-5 py-10 flex-1">
    <div class="mb-6">
      <h2 class="text-lg font-bold text-slate-200">Select a Lesson</h2>
      <p class="text-sm text-slate-400">Tap any lesson card below to launch the interactive presentation.</p>
    </div>

    <div id="lessons-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800 text-slate-500 text-xs py-5 px-5 text-center">
    Grade 9 MYP Mathematics • Interactive Whiteboard &amp; Student Resources
  </footer>

  <script>
    const lessons = [
      {
        number: "01",
        title: "Forming & Solving Equations",
        subtitle: "Translating word problems into linear equations and solving step-by-step",
        folder: "./Forming-Solving-Equations/",
        tag: "Equations",
        icon: "fa-equals",
        accent: "sky"
      },
      {
        number: "02",
        title: "More Forming & Solving Equations",
        subtitle: "Multi-step equations, brackets, unknowns on both sides & geometric applications",
        folder: "./More-Forming-Solving-Equations/",
        tag: "Equations",
        icon: "fa-scale-balanced",
        accent: "emerald"
      },
      {
        number: "03",
        title: "Power Equations",
        subtitle: "Solving equations involving squares, cubes, square roots & cube roots",
        folder: "./Power-Equations/",
        tag: "Powers & Roots",
        icon: "fa-superscript",
        accent: "purple"
      },
      {
        number: "04",
        title: "Interpreting & Representing Inequalities",
        subtitle: "Number lines, double & compound inequalities, plus self-check Toddle homework",
        folder: "./Interpreting-Inequalities/",
        homework: "./Interpreting-Inequalities/homework.html",
        tag: "Inequalities",
        icon: "fa-less-than-equal",
        accent: "amber"
      }
    ];

    const accentStyles = {
      sky: {
        badge: "bg-sky-500/15 text-sky-300 border-sky-400/30",
        iconBox: "bg-sky-500/20 text-sky-400 border-sky-400/30",
        hover: "hover:border-sky-400/60"
      },
      emerald: {
        badge: "bg-emerald-500/15 text-emerald-300 border-emerald-400/30",
        iconBox: "bg-emerald-500/20 text-emerald-400 border-emerald-400/30",
        hover: "hover:border-emerald-400/60"
      },
      purple: {
        badge: "bg-purple-500/15 text-purple-300 border-purple-400/30",
        iconBox: "bg-purple-500/20 text-purple-400 border-purple-400/30",
        hover: "hover:border-purple-400/60"
      },
      amber: {
        badge: "bg-amber-500/15 text-amber-300 border-amber-400/30",
        iconBox: "bg-amber-500/20 text-amber-400 border-amber-400/30",
        hover: "hover:border-amber-400/60"
      }
    };

    const grid = document.getElementById("lessons-grid");
    grid.innerHTML = lessons.map(lesson => {
      const st = accentStyles[lesson.accent] || accentStyles.sky;
      const hwLink = lesson.homework
        ? `<a href="${lesson.homework}" class="inline-flex items-center gap-1.5 text-xs font-bold text-amber-300 hover:text-amber-200 bg-amber-500/15 border border-amber-400/30 px-3 py-1.5 rounded-lg transition">
             <i class="fa-solid fa-clipboard-check"></i> Homework Quiz
           </a>`
        : "";

      return `
        <div class="bg-slate-900/90 border border-slate-800 ${st.hover} rounded-2xl p-6 flex flex-col justify-between transition shadow-lg">
          <div>
            <div class="flex items-center justify-between gap-3 mb-4">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl border ${st.iconBox} flex items-center justify-center text-sm">
                  <i class="fa-solid ${lesson.icon}"></i>
                </div>
                <span class="font-math text-xs font-bold text-slate-400">LESSON ${lesson.number}</span>
              </div>
              <span class="text-[11px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full border ${st.badge}">
                ${lesson.tag}
              </span>
            </div>

            <h3 class="text-xl font-extrabold text-white mb-2">${lesson.title}</h3>
            <p class="text-sm text-slate-400 leading-relaxed mb-6">${lesson.subtitle}</p>
          </div>

          <div class="flex flex-wrap items-center justify-between gap-2 pt-4 border-t border-slate-800">
            <a href="${lesson.folder}" class="inline-flex items-center gap-2 text-sm font-bold text-white bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl transition">
              <span>Open Lesson</span> <i class="fa-solid fa-arrow-right text-xs"></i>
            </a>
            ${hwLink}
          </div>
        </div>
      `;
    }).join("");
  </script>
</body>
</html>
